<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfterSchool-Booking System</title>
</head>

<body>
    <div id="app">
        <h1 v-text="heading"></h1>
        <button v-bind:disabled="numberOfItems === 0" v-on:click="toggleCart()">
            Checkout ({{ numberOfItems }})
        </button>

        <div v-if="!displayCart">
            <!-- lessons -->
            <div v-for=" lesson in lessons">
                <p>Subject : {{lesson.subject}}</p>
                <p>Location : {{lesson.location}}</p>
                <p>Availability : {{lesson.availability}}</p>
                <p>Price : {{lesson.price}}</p>
                <img :src="lesson.image" :alt="lesson.altText" width="300" />
                <button v-on:click="addToCart(lesson)" v-bind:disabled="lesson.availability <= 0">
                    Add to cart
                </button>
            </div>
        </div>
        <div v-else>
            <h2>Checkout</h2>

            <div v-for="lesson in lessons">
                <div v-if="cartItemCount(lesson.id) > 0">
                    <hr />

                    <h4 v-text="lesson.subject"></h4>

                    <p>Price: £{{ lesson.price }}</p>

                    <p>Quantity: {{ cartItemCount(lesson.id) }}</p>
                    <button v-on:click="removeFromCart(lesson)">Remove</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        const myApp = createApp({
            data() {
                return {
                    heading: "AfterSchool",
                    displayCart: false,
                    lessons: [
                        {
                            id: 1,
                            availability: 5,
                            subject: "Computer Science",
                            location: "Hendon",
                            price: 100,
                            image: "./images/computer.jpg",
                            altText: "Computer Science lesson",
                        },
                        {
                            id: 2,
                            availability: 5,
                            subject: "Music",
                            location: "Camden",
                            price: 80,
                            image: "./images/music.jpg",
                            altText: "Music lesson",
                        },
                        {
                            id: 3,
                            availability: 5,
                            subject: "Mathematics",
                            location: "Finchley",
                            price: 90,
                            image: "./images/maths.jpg",
                            altText: "Mathematics lesson",
                        },
                    ],
                    cart: [],
                };
            },
            computed: {
                numberOfItems() {
                    return this.cart.length;
                },
            },
            methods: {
                addToCart(lesson) {
                    this.cart.push(lesson.id);
                    lesson.availability = lesson.availability - 1;
                },
                removeFromCart(lesson) {
                    let index = this.cart.indexOf(lesson.id);
                    if (index !== -1) {
                        this.cart.splice(index, 1);
                        lesson.availability = lesson.availability + 1;
                    }
                },
                toggleCart() {
                    this.displayCart = !this.displayCart;
                },
                cartItemCount(id) {
                    let count = 0;

                    for (let i = 0; i < this.cart.length; i++) {
                        if (this.cart[i] === id) {
                            count++;
                        }
                    }

                    return count;
                },
            },
        });
        myApp.mount("#app");
    </script>
</body>

</html>
